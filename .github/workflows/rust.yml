name: Rust CLI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (release)
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/shellscope

      - name: Upload shellscope artifact
        uses: actions/upload-artifact@v4
        with:
          name: shellscope-linux-x86_64
          path: target/release/shellscope
